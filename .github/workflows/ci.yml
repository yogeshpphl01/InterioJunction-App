name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:

jobs:
  backend:
    name: Backend (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile backend
        run: python -m compileall -q backend

  frontend:
    name: Frontend (lint + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Lint app sources
        run: npx eslint app src
      - name: Type-check (informational)
        # The repo's shared UI components don't declare `testID` in their prop
        # types, so a full strict type-check reports long-standing errors that
        # don't affect the Metro/Babel build. Kept visible but non-blocking.
        continue-on-error: true
        run: npx tsc --noEmit
